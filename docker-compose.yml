# =========================================================================
# DOCKER COMPOSE PARA PRODUÇÃO - OTIMIZADO
# =========================================================================
# Remove componentes desnecessários para produção (Node, Cypress)
# Use imagem pré-compilada do Superset


# Versão PINADA. Nunca usar `latest`: em 31/08/2026 a tag `latest` do Docker Hub
# passou de 6.0.0 para 6.1.0 sem aviso, e um `docker compose pull` casual teria
# feito o upgrade (com migração de banco) sem ninguém pedir. TAG e BROWSER_TAG
# andam juntos — a imagem do browser é FROM apache/superset:${SUPERSET_VERSION}.
x-superset-image: &superset-image apachesuperset.docker.scarf.sh/apache/superset:${TAG:-6.1.0}
# Mesma imagem + Playwright/Chromium, para os screenshots de Alerts & Reports.
# Build: docker build --build-arg SUPERSET_VERSION=6.1.0 -t astecha/superset-browser:6.1.0 docker-browser/
# Só o worker precisa do browser (ver docs de Alerts and Reports).
x-superset-browser-image: &superset-browser-image astecha/superset-browser:${BROWSER_TAG:-6.1.0}

services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/nginx/superset.conf:/etc/nginx/conf.d/superset.conf:ro
      - ./conf/certbot/conf:/etc/letsencrypt:ro
      - ./conf/certbot/www:/var/www/certbot:ro
      - ./logs:/var/log/nginx
    depends_on:
      - superset
    networks:
      - superset
  
  certbot:
    image: certbot/certbot
    volumes:
      - ./conf/certbot/conf:/etc/letsencrypt
      - ./conf/certbot/www:/var/www/certbot
    networks:
      - superset

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    networks:
      - superset

  db:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - superset

  superset:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    # `app` sobe o servidor de DESENVOLVIMENTO do Flask (werkzeug) com --reload e
    # --debugger; `app-gunicorn` chama /usr/bin/run-server.sh, que é o gunicorn.
    # Trocado em 21/09/2026 — ver bloco `environment` abaixo para o dimensionamento.
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    # Parâmetros do gunicorn. Todos são lidos por /usr/bin/run-server.sh (na
    # imagem oficial) e ficam aqui, e não em docker/.env-local, porque não são
    # segredo e o dimensionamento tem que andar versionado junto do compose.
    environment:
      # EC2 de 2 vCPU / 3,8 GB dividida com worker do Celery, Postgres, Redis e
      # nginx. O processo web sozinho já usava ~575 MB no flask, e cada worker do
      # gunicorn custa outro tanto: 2 workers é o teto seguro aqui. A concorrência
      # real vem das threads (gthread), que é o que importa para uma carga que
      # passa o tempo esperando o Snowflake responder.
      SERVER_WORKER_AMOUNT: "2"
      SERVER_THREADS_AMOUNT: "20"
      # Cadeia de timeout, do mais curto para o mais longo:
      #   front 300s (SUPERSET_WEBSERVER_TIMEOUT) < gunicorn 330s < nginx 360s
      # O default do run-server.sh é 60s e cortaria os gráficos de 5 min.
      GUNICORN_TIMEOUT: "330"
      # nginx mantém keepalive 100 para o upstream (conf/nginx/superset.conf);
      # 2s do default derruba essas conexões cedo demais.
      GUNICORN_KEEPALIVE: "5"
      # WORKER_MAX_REQUESTS fica no default (0 = sem reciclagem) DE PROPÓSITO: o
      # run-server.sh não expõe --graceful-timeout, que fica nos 30s do default,
      # então reciclar worker mataria justamente a query de 5 min em andamento.
    expose:
      - 8088
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
      # Assets da marca (logos) servidos em /static/assets/astecha/ — referenciados
      # pelo tema em docker/themes/*.json e por APP_ICON no superset_config_docker.py.
      - ./docker/assets:/app/superset/static/assets/astecha:ro
    networks:
      - superset
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  superset-init:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      disable: true

  superset-worker:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-browser-image
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5

  superset-worker-beat:
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      disable: true

  # Só para Global Async Queries (GAQ), que NÃO usamos. Fica atrás de um profile
  # para o `compose up -d` não subi-lo: sem GAQ o docker-bootstrap.sh responde
  # "Unknown Operation!!!" e o container entra em restart loop (visto no upgrade 6.1.0).
  superset-websocket:
    profiles: ["gaq"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    image: *superset-image
    command: ["/app/docker/docker-bootstrap.sh", "websocket"]
    restart: unless-stopped
    ports:
      - "${WEBSOCKET_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: root
    volumes:
      - ./docker:/app/docker
      - superset_home:/app/superset_home
    networks:
      - superset
    healthcheck:
      disable: true

volumes:
  superset_home:
    driver: local
  db_home:
    driver: local
  redis:
    driver: local

networks:
  superset:
    driver: bridge
