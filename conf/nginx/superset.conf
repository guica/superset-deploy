# Upstream para Superset
upstream superset_app {
    server superset:8088;
    keepalive 100;
}

# Servidor HTTP - redireciona para HTTPS
server {
    listen 80;
    server_name dashboard.astecha.com.br;

    # Permite Let's Encrypt fazer validação
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o resto para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS
server {
    listen 443 ssl;
    server_name dashboard.astecha.com.br;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/dashboard.astecha.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.astecha.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Bloqueia scans do zgrab pelo User-Agent
    if ($http_user_agent ~* "zgrab") {
        return 403;
    }

    # Bloqueia métodos HTTP perigosos
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$ ) {
        return 405;
    }

    # Limita tamanho do corpo da requisição (já definido no nginx.conf mas pode sobrescrever)
    client_max_body_size 50M;

    # Oculte a versão do NGINX
    server_tokens off;

    # Bloqueia acesso a arquivos ocultos e sensíveis
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Segurança - Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Superset principal
    location / {
        proxy_pass http://superset_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        port_in_redirect off;
        # Folga acima do SUPERSET_WEBSERVER_TIMEOUT (300s, em
        # docker/pythonpath_dev/superset_config_docker.py): quem tem que cortar
        # a query lenta do gráfico é o front, com mensagem de timeout, e não o
        # nginx com um 504 seco. Se subir o teto dos gráficos, subir estes junto.
        proxy_connect_timeout 60;
        proxy_send_timeout 360;
        proxy_read_timeout 360;
    }
}
